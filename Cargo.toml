[package]
name = "light-indexer"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "light-indexer"
path = "src/main.rs"

[lib]
name = "light_indexer"
path = "src/lib.rs"

[dependencies]
# Solana
solana-pubkey = { version = "4.2", features = ["serde"] }
solana-signature = { version = "3.4", features = ["serde"] }

# Yellowstone gRPC + Richat
yellowstone-grpc-proto = "11.0.0"
richat-client = "8.1.1"
richat-proto = "8.0.0"

# Storage
rocksdb = { version = "0.22", default-features = false, features = ["lz4", "zstd"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio", "tls-rustls", "postgres", "macros", "json", "chrono",
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
bincode = "1.3"
bs58 = "0.5"
prost = "0.13"

# Async runtime
tokio = { version = "1.44", features = ["full"] }
futures = "0.3"

# HTTP / RPC
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "compression-br"] }
jsonrpsee = { version = "0.24", features = ["server"] }
jsonrpsee-core = "0.24"
jsonrpsee-types = "0.24"
hyper = { version = "1.6", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus = { version = "0.13", features = ["push"] }

# CLI & config
clap = { version = "4.5", features = ["derive"] }
figment = { version = "0.10", features = ["yaml", "env"] }

# Utilities
anyhow = "1.0"
thiserror = "2.0"
num_cpus = "1.16"
chrono = "0.4"
parking_lot = "0.12"
bytes = "1.10"
lz4 = "1.28"
reqwest = { version = "0.12", features = ["json"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = "symbols"

[lints.clippy]
clone_on_ref_ptr = "deny"
missing_const_for_fn = "deny"
trivially_copy_pass_by_ref = "deny"
